# ASSUMPTION: experiment design; see docs/parameters.md. Full defaults, not a quick run.
seed: 707
replications: 30
workers: 8
warmup_days: 90
horizon_days: 365
training_days: 180
e2:
  targets: [0.9, 0.95, 0.98, 0.99, 0.995]
  skus: [SKU01, SKU07, SKU15]
e3:
  dc_counts: [1, 2, 4, 8]
  demand_cvs: [0.2, 0.4, 0.8]
  correlations: [0.0, 0.3, 0.6, 0.9]
  outbound_factors: [0.5, 1.0, 2.0]
  inbound_days: [3.0, 7.0, 14.0]
  screen_replications: 10
  confirm_replications: 30
  break_even_fraction: 0.05
e4:
  sharing: [false, true]
  lead_factors: [1.0, 0.5]
e5:
  calibration_replications: 5
  offsets: [-1.5, -1.0, -0.5, 0.0, 0.5, 1.0, 1.5, 2.0]
  service_tolerance: 0.005
e6:
  events_config: configs/m6_validation.yaml
  sensitivities: [demand, capacity, lead, holding]
  sensitivity_factors: [0.8, 1.2]
  mitigations:
    none: {}
    stock_buffer: {buffer_days: 7}
    expedite: {expedite_factor: 0.5, expedite_unit_cost: 20}
    dual_sourcing: {backup_suppliers: {S1: S2, S2: S1, S3: S1, S4: S1}}
